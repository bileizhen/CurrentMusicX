<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>CurrentMusic</title>
  <!-- UI 预设：在样式表之前把皮肤属性打到 <html> 上，避免切到非默认皮肤时闪一下默认样式。
       只读 localStorage，出错静默（默认即原样式）。 -->
  <script>
    try {
      var p = localStorage.getItem('cm.uiPreset');
      // 默认皮肤 = 简约玻璃（v1.21.14 起）：未选择过 → frost；
      // 显式选了 Material 3 → 不打属性（基础样式）；其余按所存值。
      if (p === 'frost' || p === 'glass') document.documentElement.setAttribute('data-ui-preset', p);
      else if (p !== 'md3') document.documentElement.setAttribute('data-ui-preset', 'frost');
      // 个性化（背景图 / 玻璃效果值）也要在样式表之前打上，否则会先闪一帧默认底色
      var bg = localStorage.getItem('cm.bgImage');
      if (bg) document.documentElement.style.setProperty('--cm-bg-image', 'url("' + bg.replace(/["\\]/g, '\\$&') + '")');
      var gb = parseFloat(localStorage.getItem('cm.glassBlur'));
      if (isFinite(gb)) document.documentElement.style.setProperty('--frs-lens-blur', String(gb));
      var gt = localStorage.getItem('cm.glassTint');
      if (gt !== null && gt !== '') document.documentElement.style.setProperty('--frs-alpha', gt);
    } catch (e) { /* 忽略 */ }
  </script>
  <link rel="stylesheet" href="app.css">
  <style>
    html, body { margin: 0; height: 100%; overscroll-behavior-y: none; }
    #boot { display: flex; height: 100%; align-items: center; justify-content: center;
      font: 16px/1.6 system-ui; color: #666; }
  </style>
</head>
<body>
  <div id="boot">CurrentMusic 加载中…</div>

  <header id="topbar">
    <div id="brandLock"><span class="material-icons-outlined">graphic_eq</span><b>CurrentMusic</b></div>
    <div id="pageTitle">CurrentMusic</div>
    <div id="topActs">
      <a id="topSearch" href="#/search" class="material-icons-outlined" title="搜索">search</a>
      <span id="topAction" class="material-icons-outlined" title="设置">settings</span>
    </div>
  </header>

  <main id="out"></main>

  <div id="mini"></div>

  <nav id="bottomNav">
    <!-- 液态玻璃「水滴」指示器：包裹当前选中的 tab，切换时像液滴一样流动拉伸。
         仅在「简约玻璃」皮肤下显示（见 app.css），默认皮肤沿用 MD3 胶囊。 -->
    <span id="navDrop" aria-hidden="true"></span>
    <a href="#/home" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">home</span></span><span>首页</span></a>
    <a href="#/square" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">explore</span></span><span>发现</span></a>
    <a href="#/library" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">library_music</span></span><span>歌单</span></a>
    <a href="#/user" class="navItem"><span class="nav-ic"><span class="material-icons-outlined">person</span></span><span>我的</span></a>
  </nav>

  <div id="playerOverlay" hidden></div>
  <div id="sheets"></div>

  <script>
    // 启动诊断：脚本解析失败/资源加载失败/超时 时给出可见错误与重试（避免永久卡在「加载中」）
    (function () {
      var shown = false;
      function show(title, detail) {
        if (shown || window.__cmBooted) return;
        shown = true;
        var boot = document.getElementById('boot');
        if (!boot) return;
        var ua = navigator.userAgent || '';
        var m = ua.match(/Chrome\/([0-9.]+)/);
        boot.innerHTML =
          '<div style="max-width:560px;margin:0 auto;padding:22px;font:14px/1.7 system-ui,sans-serif;color:#1d1b20">' +
            '<div style="font-size:calc(19px * var(--cm-fs, 1));font-weight:700;color:#b3261e;margin-bottom:6px">启动失败：' + title + '</div>' +
            '<div style="font-size:calc(12px * var(--cm-fs, 1));color:#49454f;margin-bottom:12px">CurrentMusic 未能完成初始化。请把下面这段信息发给开发者，并先尝试下方的建议。</div>' +
            '<div style="background:#f7f2fa;border-radius:10px;padding:12px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto">' +
              (detail || '(无错误详情)').replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
              '\n\n系统 WebView：' + (m ? ('Chrome ' + m[1]) : '未知') +
              '\nUA: ' + ua +
            '</div>' +
            '<div style="margin:16px 0 4px;font-weight:600">可尝试</div>' +
            '<ol style="margin:0;padding-left:20px;font-size:calc(13px * var(--cm-fs, 1));color:#49454f">' +
              '<li>应用商店 / 系统设置里更新「Android System WebView」（或 Chrome）后重开 App</li>' +
              '<li>点击下方「重试」重新加载</li>' +
              '<li>仍失败请把上面的信息截图反馈</li>' +
            '</ol>' +
            '<div style="margin-top:18px;display:flex;gap:10px">' +
              '<button onclick="location.reload()" style="flex:1;height:44px;border:none;border-radius:22px;background:#6750a4;color:#fff;font-size:calc(15px * var(--cm-fs, 1))">重试</button>' +
              '<button id="cmCopyDiag" style="height:44px;padding:0 18px;border-radius:22px;border:1px solid #79747e;background:transparent;font-size:calc(14px * var(--cm-fs, 1))">复制信息</button>' +
            '</div>' +
          '</div>';
        var pre = boot.querySelector('div > div:nth-child(3)');
        var btn = document.getElementById('cmCopyDiag');
        if (btn) btn.onclick = function () {
          try {
            var t = pre ? pre.textContent : detail;
            (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
              function () { btn.textContent = '已复制'; },
              function () { btn.textContent = '请长按选中复制'; }
            );
          } catch (e) { btn.textContent = '请长按选中复制'; }
        };
      }
      window.__cmDiag = show;
      window.addEventListener('error', function (e) {
        if (window.__cmBooted) return;
        if (e.message || e.filename) show('脚本执行错误', (e.message || '') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (window.__cmBooted) return;
        var r = e.reason;
        show('初始化异常', String((r && r.stack) || (r && r.message) || r));
      });
      // 超时兜底：脚本没跑到 boot 完成（解析失败/资源未加载）
      setTimeout(function () {
        if (!window.__cmBooted && !shown) {
          show('加载超时', '应用脚本未能执行。常见原因：系统 WebView 版本过旧（不支持的 JS 语法）或资源加载被系统拦截。');
        }
      }, 9000);
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
