name: Publish CI build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main Android CI run to publish
        required: true
        type: string
      run_attempt:
        description: Exact Android CI run attempt
        required: true
        type: string
  workflow_run:
    workflows: [Android CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.result }}
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Both supported triggers are restricted to the trusted main revision.
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v8
        id: scope
        with:
          script: |
            const {resolveUpstream} = require('./.github/scripts/ci-publication.cjs');
            const run = await resolveUpstream({github, context});
            if (!run) return false;
            core.setOutput('run', JSON.stringify({
              id: run.id, run_number: run.run_number, run_attempt: run.run_attempt,
              head_sha: run.head_sha, head_branch: run.head_branch,
              head_repository: {full_name: run.head_repository.full_name},
              event: run.event, path: run.path, status: run.status, conclusion: run.conclusion,
            }));
            const {releaseDecision} = require('./.github/scripts/ci-batch.cjs');
            const decision = await releaseDecision({github, context, sha: run.head_sha});
            core.info(decision.reason);
            return decision.required;
  publish:
    needs: gate
    if: needs.gate.outputs.required == 'true'
    concurrency:
      group: ci-distribution
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: ci-signing
    env:
      UPSTREAM_RUN: ${{ needs.gate.outputs.run }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      # The only secret-bearing job runs trusted main scripts, never a PR head.
      - uses: actions/checkout@v5
        with:
          # Both supported triggers are restricted to the trusted main revision.
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: ci-unsigned
          path: ci-dist
          run-id: ${{ fromJSON(needs.gate.outputs.run).id }}
          github-token: ${{ github.token }}
      - name: Verify upstream artifact metadata
        uses: actions/github-script@v8
        with:
          script: |
            const {validateMetadata} = require('./.github/scripts/ci-release.cjs');
            const metadata = JSON.parse(require('node:fs').readFileSync('ci-dist/output-metadata.json', 'utf8'));
            const {tag} = validateMetadata(metadata, JSON.parse(process.env.UPSTREAM_RUN).run_number);
            core.exportVariable('CI_TAG', tag);
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "build-tools;35.0.0"
      - name: Sign with the existing release certificate
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing CI signing keystore}"
          keyfile="$RUNNER_TEMP/ci-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          apk=(ci-dist/*.apk)
          test "${#apk[@]}" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$SIGNING_KEY_ALIAS" --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD "${apk[0]}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "${apk[0]}"
      - uses: actions/github-script@v8
        with:
          script: |
            const {releaseDecision} = require('./.github/scripts/ci-batch.cjs');
            const upstreamRun = JSON.parse(process.env.UPSTREAM_RUN);
            await require('./.github/scripts/ci-release.cjs').publish({github,context,core,releaseDecision,upstreamRun});

  request-cleanup:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Explicit dispatch also keeps retention working after bot-triggered runs.
      - uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci-prune.yml', ref: 'main',
            });
