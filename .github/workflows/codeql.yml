name: CodeQL security analysis

# Heavy Android/Kotlin extraction stays off the PR critical path.
# GitHub Actions schedules use UTC: Saturday 20:00 = Sunday 04:00 Beijing.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'scripts/**'
  schedule:
    - cron: '0 20 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Source analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  compiled:
    # Avoid an extra Android build when developers open/update ordinary PRs.
    if: github.event_name != 'pull_request'
    name: Compiled analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: c-cpp
            build-mode: none
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android toolchain
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - name: Set up Gradle caching
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile Kotlin for CodeQL (no APK, no lint)
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew :app:compileReleaseKotlin \
            -Plei.officialRepositoriesFirst=true \
            -PciPrArm64Only=true \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            --max-workers=2 --no-parallel --no-daemon --build-cache --stacktrace
      - name: Analyze compiled languages
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
