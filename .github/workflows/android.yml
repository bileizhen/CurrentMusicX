name: Android CI
run-name: Build CI release · main
on:
  workflow_dispatch:
    inputs:
      batch_wakeup:
        description: Apply the automatic release batch policy
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Determine Android build scope
        id: scope
        uses: actions/github-script@v8
        with:
          script: |
            const {releaseDecision} = require('./.github/scripts/ci-batch.cjs');
            const verifyOnly = context.payload.inputs?.batch_wakeup !== 'true';
            const decision = await releaseDecision({github, context, sha: context.sha, verifyOnly});
            if (typeof decision.required !== 'boolean') throw new Error('Invalid Android build decision');
            core.info(decision.reason);
            await core.summary.addRaw(decision.reason).write();
            core.setOutput('required', decision.required);

  build:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 512M
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-24.04 includes these exact Android SDK/NDK/CMake versions.
      # Avoid the expensive, repeated sdkmanager invocation on every CI run.
      - name: Ensure required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -d "$ANDROID_HOME/platforms/android-37.0" ]] || missing+=("platforms;android-37.0")
          [[ -d "$ANDROID_HOME/build-tools/35.0.0" ]] || missing+=("build-tools;35.0.0")
          [[ -d "$ANDROID_HOME/ndk/30.0.16248370" ]] || missing+=("ndk;30.0.16248370")
          [[ -d "$ANDROID_HOME/cmake/4.1.2" ]] || missing+=("cmake;4.1.2")
          if (( ${#missing[@]} )); then
            sdkmanager "${missing[@]}"
          else
            echo "Required Android SDK packages are already installed."
          fi
      - uses: gradle/actions/setup-gradle@v5
      # Cache compiler outputs rather than copying AGP's timestamp-sensitive .cxx tree.
      # The NDK's Android toolchain uses ANDROID_CCACHE as a compiler launcher.
      - name: Prepare native compiler cache
        id: native-setup
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            if ! (sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ccache); then
              echo "::warning::ccache installation failed; using normal native compiler."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --version
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Restore native compiler cache
        if: steps.native-setup.outputs.enabled == 'true'
        id: native-ccache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cmx-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ndk30-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cmx-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-ndk30-
      - name: Reset native cache counters
        if: steps.native-setup.outputs.enabled == 'true'
        run: ccache --zero-stats
      - name: Bundle installed CI release notes
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/bundled-release-notes.cjs').bundle({github, context});
      - name: Build and verify unsigned CI release
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease -PciBuildNumber="$CI_BUILD_NUMBER" -PinstalledReleaseNotesDir="$GITHUB_WORKSPACE/app/build/generated/installedReleaseNotes" -Plei.officialRepositoriesFirst=true -PciNativeCcache=${{ steps.native-setup.outputs.enabled }} --build-cache --no-daemon --stacktrace --profile
      - name: Prepare CI artifact
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: node .github/scripts/ci-release.cjs prepare
      - name: Upload unsigned CI APK
        uses: actions/upload-artifact@v6
        with:
          name: ci-unsigned
          path: ci-dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle build performance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-profile
          path: '**/build/reports/profile/*.html'
          if-no-files-found: ignore
          retention-days: 7

      - name: Native compiler cache statistics
        if: always() && steps.native-setup.outputs.enabled == 'true'
        run: ccache --show-stats
      - name: Save warmed native compiler cache
        if: success() && steps.native-setup.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native-ccache.outputs.cache-primary-key }}

  request-publication:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # GITHUB_TOKEN dispatches do not reliably propagate workflow_run events.
      # This job has no checkout or signing secrets; the publisher revalidates it.
      - name: Request CI publication
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci-distribution.yml', ref: 'main',
              inputs: {run_id: String(context.runId), run_attempt: process.env.GITHUB_RUN_ATTEMPT},
            });
