name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Determine Android build scope
        id: scope
        run: node .github/scripts/android-ci-scope.cjs
      - name: Documentation or CI-only change
        if: steps.scope.outputs.required == 'false'
        run: echo 'Documentation or checked CI automation only; skipped Android toolchains, APK build and artifact uploads. Script tests and workflow validation run in Collaboration checks.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.required == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.scope.outputs.required == 'true'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        if: steps.scope.outputs.required == 'true'
        run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.scope.outputs.required == 'true'
      - name: Test native source contract and legal assets
        if: steps.scope.outputs.required == 'true'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build debug APK and run unit tests
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        run: ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest lintDebug --no-daemon --stacktrace -Plei.officialRepositoriesFirst=true
      - name: Build and verify unsigned CI release
        if: steps.scope.outputs.required == 'true' && github.event_name != 'pull_request'
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest :app:lintRelease -PciBuildNumber="$CI_BUILD_NUMBER" -Plei.officialRepositoriesFirst=true --no-daemon --stacktrace
      - name: Prepare CI artifact
        if: steps.scope.outputs.required == 'true' && github.event_name != 'pull_request'
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: node .github/scripts/ci-release.cjs prepare
      - name: Upload debug APK
        if: steps.scope.outputs.required == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned CI APK
        if: steps.scope.outputs.required == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-unsigned
          path: ci-dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: always() && steps.scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/test*UnitTest/
      - name: Upload lint report
        if: always() && steps.scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*
