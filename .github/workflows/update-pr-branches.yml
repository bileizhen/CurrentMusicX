name: Update PR branches
on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-pr-branches
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'bileizhen/CurrentMusicX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Write token never executes PR-head code, build scripts or downloaded artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/update-pr-branches.cjs').run({github, context, core});
