name: Collaboration triage
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  triage:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow: only trusted default-branch code, never PR-head code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          TRIAGE_MODE: ${{ vars.TRIAGE_MODE || 'live' }}
        with:
          script: |
            await require('./.github/scripts/collaboration.cjs').run({github, context, core});
