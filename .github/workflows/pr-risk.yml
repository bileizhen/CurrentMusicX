name: PR risk assessment
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {classify} = require('./.github/scripts/pr-risk.cjs');
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            const {level, reason} = classify(files);
            const labels = ['risk: low','risk: medium','risk: high'];
            const live = await github.rest.issues.get({...context.repo,issue_number:pr.number});
            const current = live.data.labels.map(x => x.name);
            for (const label of labels) {
              if (label !== 'risk: ' + level && current.includes(label)) {
                await github.rest.issues.removeLabel({...context.repo,issue_number:pr.number,name:label});
              }
            }
            const name = 'risk: ' + level;
            try {
              await github.rest.issues.getLabel({...context.repo,name});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,name,
                color: level === 'high' ? 'd73a4a' : level === 'medium' ? 'fbca04' : '0e8a16',
                description: 'Automated PR change risk classification'
              });
            }
            if (!current.includes(name)) {
              await github.rest.issues.addLabels({...context.repo,issue_number:pr.number,labels:[name]});
            }
            core.summary.addHeading('PR risk: ' + level).addRaw(reason).write();
