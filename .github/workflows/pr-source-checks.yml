name: PR source checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-source-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Keep the status context required by main's branch protection.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check Python source syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('scripts').glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
