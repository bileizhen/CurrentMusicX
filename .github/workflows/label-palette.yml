name: Synchronize label colors
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/label-palette.yml
      - .github/scripts/label-palette.cjs
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: label-palette
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'bileizhen/CurrentMusicX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check automation script syntax
        run: node --check .github/scripts/label-palette.cjs
      - name: Create issue status labels and sync colors
        uses: actions/github-script@v8
        with:
          script: |
            const {STATUS_LABELS,colorChanges}=require('./.github/scripts/label-palette.cjs');
            const labels=await github.paginate(github.rest.issues.listLabelsForRepo,{
              ...context.repo,per_page:100
            });
            const changes=colorChanges(labels);
            const existing=new Set(labels.map(label=>label.name.toLowerCase()));
            const missing=Object.entries(STATUS_LABELS).filter(([name])=>!existing.has(name));
            for (const [name,properties] of missing) {
              await github.rest.issues.createLabel({...context.repo,name,...properties});
              core.info(`Created ${name}`);
            }
            for (const item of changes) {
              await github.rest.issues.updateLabel({...context.repo,name:item.name,color:item.after});
              core.info(`Label ${item.name}: ${item.before} -> ${item.after}`);
            }
            await core.summary.addHeading('CurrentMusicX · 标签配色已同步')
              .addRaw(`已创建 ${missing.length} 个处理状态标签，更新 ${changes.length} 个已有标签的颜色。`)
              .write();
