changelog:
  exclude:
    labels:
      - ignore-for-release
      - ci-internal
  categories:
    - title: Breaking Changes
      labels:
        - breaking
        - breaking-change
    - title: New features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Performance Improvements
      labels:
        - performance
        - perf
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - maintenance
        - chore
        - ci
        - build
        - refactor
        - test
    - title: Other Changes
      labels:
        - '*'
