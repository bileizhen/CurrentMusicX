name: "✨ 功能建议"
description: "提出新功能、体验优化或现有能力的改进建议"
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！提交前请先[搜索已有建议](https://github.com/bileizhen/CurrentMusicX/issues?q=is%3Aissue+label%3Aenhancement)。

        请尽量说明**遇到什么问题、在哪种场景下使用、希望达到什么效果**。一个 Issue 聚焦一个需求；提出建议不代表功能一定会实现。
  - type: dropdown
    id: module
    attributes:
      label: 问题模块
      description: "请选择建议涉及的模块，便于自动分类。"
      options:
        - 播放与音效
        - 歌词
        - 音源与网络
        - 界面与外观
        - 下载与缓存
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 需求与使用场景
      description: "当前遇到了什么限制？什么情况下会需要这个功能？"
      placeholder: "例如：在……场景下，我需要……，但当前只能……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: "描述理想的操作方式和最终效果；如果有多个方案，请指出最希望实现的一个。"
      placeholder: "希望在……页面增加……，点击后可以……"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
      description: "可提供现有替代方法、设计草图、其他应用的参考截图或相关 Issue 链接（均可选）。"
      placeholder: "替代方案、示例截图或补充说明（可选）"
