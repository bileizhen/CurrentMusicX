name: 功能建议
description: 新功能、交互或现有能力的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求与使用场景
      description: 目前遇到什么问题，希望改善什么？请先搜索已有建议。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
